abstract = "The Purrline Rocketworks part mods in one pack: the Prisma launcher, the Fairings set, the Facet satellite kit, the Tessera lunar lander kit, the Andoya Spaceport launch site and the propane they burn."
description = '''
Everything you need to fly the Prisma launcher from its own launch site, put Facet satellites into orbit and land Tessera landers on the Moon.

**Prisma by Purrline Rocketworks** 1.1.2 by Maxi
A two-stage small satellite launcher, about 28 m tall and 2 m wide: stage 1 with nine Altair engines, an upper stage with RCS, a 2 m fairing, a payload mass simulator and a ground set. It follows the stock size classes and mixes with stock parts.

**Fairings by Purrline Rocketworks** 1.0.0 by Maxi
Payload fairings in 2 m and 3 m with three lengths each, white or black carbon, with base rings and hammerhead bases from 2 m to 3 m and from 3 m to 4 m. Prisma contains the 2 m fairing of this set, and the two mods work together.

**Facet by Purrline Rocketworks** 1.0.5 by Maxi
Satellite parts for small launchers: a rideshare rack with 3U, 6U and 12U cube satellites, and a kit for small satellites and probes with a bus, solar wings, instruments, antennas and the Alcor kick engine. Many parts come bare, in gold foil or in white cloth.

**Tessera by Purrline Rocketworks** 1.0.1 by Maxi
A modular lunar lander kit of 18 parts with 38 variants: decks, wall and solar panels, a thrust cone, sphere, capsule and drum tanks, the Mizar descent engine and landing legs that snap together at their edges, from a small hopper to a cargo lander.

**Andoya Spaceport** 1.0.1 by Maxi
A launch site in northern Norway with a pad on a quay, a tower, a tank farm, lamps at night and sun shadows. The lamps and shadows need StarMap.

**Extended Propellants** 1.0.0 by Maxi
Liquid propane and the liquid oxygen and propane reaction that the Prisma engines burn.

The pack follows the newest releases of these mods: when one of them updates, a new version of the pack follows.
'''
