# Keeps every pinned dependency of this repository current: the actions of the workflows, the Python packages of the tools, and the npm packages of the bundles in site/vendor.
# Each entry runs every day, so a fixed release reaches a pull request within a day.
# Security updates do not wait for this schedule, because Dependabot opens them when an advisory is published.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Dependabot reads .github/workflows/ from here.
    directory: "/"
    schedule:
      interval: "cron"
      # Every day at 05:00 UTC, weekends included, because "daily" runs only Monday to Friday.
      cronjob: "0 5 * * *"
    groups:
      # All action bumps arrive as one pull request, because the checks of that one pull request show at once whether a job breaks.
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    # The exact pins the checks and the privileged jobs install with pip install -r.
    directory: "/tools"
    schedule:
      interval: "cron"
      # Every day at 05:00 UTC, weekends included, because "daily" runs only Monday to Friday.
      cronjob: "0 5 * * *"
    # The increase strategy writes the new version into the == pin, so a pin stays exact.
    versioning-strategy: "increase"
    groups:
      # Minor and patch bumps arrive as one pull request.
      # A major bump stays on its own, because that is the one that can break a check.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    # The packages the entries of the bundles in site/vendor import, and the esbuild version that builds them.
    # package-lock.json pins the packages they pull in, so an inner package moves only with the package that needs it.
    # Nothing installs them, and site/test/vendor.test.js fails until the bundle is built again and site/vendor/README.md names the new versions.
    directory: "/site/vendor"
    schedule:
      interval: "cron"
      # Every day at 05:00 UTC, weekends included, because "daily" runs only Monday to Friday.
      cronjob: "0 5 * * *"
    # The increase strategy keeps the exact versions exact.
    versioning-strategy: "increase"
    groups:
      # Minor and patch bumps arrive as one pull request, because the bundles are built again together.
      # A major bump stays on its own, because that is the one that can break the page.
      minor-and-patch:
        update-types: ["minor", "patch"]
