# Keeps the actions the checks run on current. Same shape as the file in
# KSAModding/Borea, so one convention covers every repository in the org.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Dependabot reads .github/workflows/ from here.
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Minor and patch bumps as one pull request instead of one each. A major
      # bump stays on its own, because that is the one that can break a job.
      minor-and-patch:
        update-types: ["minor", "patch"]
