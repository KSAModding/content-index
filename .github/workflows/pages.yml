# Deploys the listing page in site/ to GitHub Pages.
#
# The page reads the schema and tags.toml of the commit it was deployed from,
# so a change to either redeploys it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'schemas/authored.schema.json'
      - 'tags.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Assemble the site
        run: |
          cp -R site _site
          rm -rf _site/test _site/package.json
          mkdir _site/rules
          cp schemas/authored.schema.json tags.toml _site/rules/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
