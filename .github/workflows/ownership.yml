# The privileged half of the listing flow (RFC 0033).
#
# It reads the verdict the unprivileged `checks` run left, checks ownership, and
# then arms auto-merge or hands the pull request to a steward. The `validate`
# commit status it posts is the required check.
name: ownership

on:
  workflow_run:
    workflows: [checks]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: >-
    ownership-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  decide:
    name: decide
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # The key of the org App is a secret of this environment, which only main may use.
    environment: index-bot
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the verdict artifact of the triggering run
      statuses: write # the commit status the branch ruleset requires
    steps:
      - uses: actions/checkout@v7

      # The packages come from the requirements of the default branch, which this
      # job checked out, before the verdict artifact is downloaded. A cache could
      # carry packages from another run into a job that holds the App key.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --only-binary=:all: -r tools/requirements.txt

      # A pull request can change checks.yml and so put any file into this
      # artifact. It goes outside the checkout, so it can not replace the tools.
      - uses: actions/download-artifact@v8
        id: verdict
        continue-on-error: true
        with:
          name: validation-verdict
          path: ${{ runner.temp }}/verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # GITHUB_TOKEN would arm a merge that starts no snapshot dispatch.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.INDEX_APP_ID }}
          private-key: ${{ secrets.INDEX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: content-index

      # The head repository, the branch and the head commit identify the pull request.
      - name: Decide
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RECORD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/decide.py \
            --verdict "$RUNNER_TEMP/verdict/verdict.json" \
            --event "$EVENT" \
            --head-repository "$HEAD_REPOSITORY" \
            --head-branch "$HEAD_BRANCH" \
            --head-sha "$HEAD_SHA" \
            --repository "$REPOSITORY" \
            --run-url "$RUN_URL" \
            --record-url "$RECORD_URL"
