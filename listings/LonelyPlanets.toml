spec_version = 1
id = "LonelyPlanets"
type = "mod"
name = "Lonely Planets"
authors = ["Jared-Melchers"]
abstract = "A mod for Kitten Space Agency that allows users to select only one planet to load."
description = """
# Lonely Planets
If you do not have sufficient VRAM to load the full Solar System, now you can select individual planets to load.  
Currently Jupiter Saturn and Mars are available, Venus is in the files, but do not work in the current version of KSA.

# Current Issues
As mentioned above Venus does not currently load. In addition the vehicle creator does not work in Jupiter, Saturn or Mars Only, the game must be loaded in 'Testing' mode (rather than 'Sandbox').

