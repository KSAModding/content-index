spec_version = 1
id = "KSAero"
type = "mod"
name = "KSAero"
authors = ["cairn5"]
abstract = "All-moving fins for Kitten Space Agency, flown on the game's own aerodynamics."
description = """
Adds all-moving fins (1 m, 2 m and 3 m) that attach to a hull like a landing leg. Each blade turns about its span axis, up to 45 degrees either way at 30 degrees a second.

The fins fly on the game's own panel aerodynamics: KSAero turns the fin's panels in the game's aero mesh as the blade moves, so the vehicle is never re-meshed and the fins get the same flow, shielding and loads as the rest of the craft.

KSAero registers its fins with [Advanced Flight Computer](https://github.com/Maximilian-Nesslauer/KSA-AdvancedFlightComputer), whose attitude control and landing guidance fly them. Without it, nothing moves the fins.

Earlier versions (0.1.x up to 0.1.2) replaced the game's drag with a simple body-of-revolution model. The game's own aerodynamics now does better, so that model is gone.
"""
license = "MIT"
tags = ["parts", "gameplay"]

