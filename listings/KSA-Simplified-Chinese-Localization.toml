[install]
steps = [
  "正常退出游戏，确认游戏版本与下载的汉化版本一致。",
  "打开本 mod 的安装文件夹 KSA-Simplified-Chinese-Localization，双击“简体中文启动.cmd”。",
  "首次运行时粘贴包含 KSA.exe 的文件夹路径并按回车。安装器会校验版本、备份原始文件、安装汉化，并以中文启动游戏。",
]
uninstall = [
  "正常退出游戏，在本 mod 文件夹中双击“还原原始游戏.cmd”，恢复被汉化替换的原始文件。",
  "还原完成后再删除本 mod 文件夹。",
]

